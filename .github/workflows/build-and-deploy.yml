name: Build and deploy .NET app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: sampleapp/sampleapp.csproj
  PUBLISH_DIR: ./publish

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download published app
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ${{ env.PUBLISH_DIR }}

      - name: Secret Information
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.Azure_PUBLISH_PROFILE }}
        run: |
          if [ -n "$AZURE_PUBLISH_PROFILE" ]; then
            echo "Azure publish profile secret is configured"
          else
            echo "Azure publish profile secret is not configured"
          fi

      - name: Print name of App Service to deploy to
        run: echo "App will be deployed to ${{ secrets.Azure_WEBAPP_NAME }}
        
      - name: List files in root directory
        run: |
          Get-ChildItem -Path . | ForEach.Oject { Write.Output $_.FullName }
        shell: pwsh